# Streamer fuer die Echtzeit-Pipeline. Neuen Streamer = neuen Block kopieren.
#
#   twitch_login   Kanalname wie in der URL (twitch.tv/<login>)
#   caption_name   Pflicht-Name in der Caption (wird IMMER eingefuegt)
#   campaign_tags  Pflicht-Hashtags der Kampagne (werden IMMER angehaengt, zuerst)
#   hashtags       weitere Hashtags fuer Reichweite (werden ebenfalls angehaengt)
#   facecam        optional, manuell: {x, y, w, h} im 1920x1080-Raster. Ohne Angabe wird sie beim ersten
#                  Clip per Gesichtserkennung vorgeschlagen und per Telegram (/ok, /redo) bestaetigt.
#   game_offset_x  optional: Gameplay-Ausschnitt nach links (-) / rechts (+) schieben
#
# Reihenfolge = Vorrang, wenn buffer.max_streams voll ist (Kampagnen-Streamer kommen immer zuerst).

streamers:
  - twitch_login: lacy
    caption_name: Lacy
    campaign_tags: ["#LACY"]
    hashtags: []

  - twitch_login: ishowspeed        # keine Kampagne, nur Reichweite
    caption_name: Speed
    campaign_tags: []
    hashtags: ["#ishowspeed"]

  - twitch_login: kaicenat          # keine Kampagne, nur Reichweite
    caption_name: Kai Cenat
    campaign_tags: []
    hashtags: ["#kaicenat"]

  - twitch_login: jynxzi            # keine Kampagne, nur Reichweite
    caption_name: Jynxzi
    campaign_tags: []
    hashtags: ["#jynxzi"]

